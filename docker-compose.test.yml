# Local Postgres for exercising the Supabase/Postgres path (blueprint §5.2,
# §12.1). Mirrors the postgres:15 service container in .github/workflows/ci-cd.yml.
#
#   docker compose -f docker-compose.test.yml up -d
#   # PowerShell:
#   $env:DATABASE_URL="postgres://aurora:aurora@localhost:5432/aurora"
#   npm run db:migrate
#   npm run db:seed -- --force
#   npm test
#   npm run dev
#
# The app service joins this file once the Phase-7 Dockerfile exists.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: aurora
      POSTGRES_DB: aurora
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora"]
      interval: 10s
      timeout: 5s
      retries: 5
